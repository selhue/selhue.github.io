    <style>
        html {
            --bg-color: #000000;
            --card-bg: #040404;
            --text-color: #f0f4f8;
            --accent-blue: #3b82f6; 
            --border-color: #1e293b;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* Initial state: Hide everything */
        header, main {
            display: none;
        }

        /* Show when authenticated */
        body.authenticated header {
            display: flex;
        }
        body.authenticated main {
            display: block;
        }

        /* Auth Screen (Centered) */
        #auth-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            z-index: 9999;
        }

        body.authenticated #auth-overlay {
            display: none;
        }

        header {
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: var(--card-bg);
            height: 64px;
            box-sizing: border-box;
        }

        .logo {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.4rem;
            color: var(--text-color);
        }

        .logo span {
            color: var(--accent-blue);
        }

        main {
            height: calc(100vh - 64px);
            padding: 16px;
            box-sizing: border-box;
        }

        .content-container {
            width: 100%;

    display: flex;
            margin: auto;
            height: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow-y: scroll;
            overflow: hidden;
        }

        iframe {
            width: 100%;

            min-height: 100dvh;
            height: 100dvh;
            border: none;
        }

        * [data-sentry-element="BadgeContent"] {
            display: none !important;
        }
